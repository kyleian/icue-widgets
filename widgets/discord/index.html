<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Discord Voice</title>
    <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
    <meta name="x-icue-widget-preview" content="resources/preview.png" />

    <!-- User-configurable properties -->
    <meta
      name="x-icue-property"
      content="proxyPort"
      data-label="Companion Port"
      data-type="textfield"
      data-default="'7575'"
    />
    <meta
      name="x-icue-property"
      content="accentColor"
      data-label="Accent Color"
      data-type="color"
      data-default="'#5865F2'"
    />
    <meta
      name="x-icue-property"
      content="textColor"
      data-label="Text Color"
      data-type="color"
      data-default="'#FFFFFF'"
    />
    <meta
      name="x-icue-property"
      content="backgroundColor"
      data-label="Background Color"
      data-type="color"
      data-default="'#23272A'"
    />
    <meta
      name="x-icue-property"
      content="showMembers"
      data-label="Show Members"
      data-type="checkbox"
      data-default="true"
    />

    <script type="application/json" id="x-icue-groups">
      [
        {
          "title": "Connection",
          "properties": ["proxyPort"]
        },
        {
          "title": "Appearance",
          "properties": ["accentColor", "textColor", "backgroundColor", "showMembers"]
        }
      ]
    </script>

    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!-- Disconnected state -->
    <div id="disconnected" class="screen">
      <div class="discord-logo">
        <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
          <path d="M20.317 4.492c-1.53-.69-3.17-1.2-4.885-1.49a.075.075 0 0 0-.079.036c-.21.369-.444.85-.608 1.23a18.566 18.566 0 0 0-5.487 0 12.36 12.36 0 0 0-.617-1.23A.077.077 0 0 0 8.562 3c-1.714.29-3.354.8-4.885 1.491a.07.07 0 0 0-.032.027C.533 9.093-.32 13.555.099 17.961a.08.08 0 0 0 .031.055 20.03 20.03 0 0 0 5.993 2.98.078.078 0 0 0 .084-.026c.462-.62.874-1.275 1.226-1.963.021-.04.001-.088-.041-.104a13.201 13.201 0 0 1-1.872-.878.075.075 0 0 1-.008-.125c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.764 8.18 1.764 12.061 0a.075.075 0 0 1 .079.009c.12.098.245.195.372.288a.075.075 0 0 1-.006.125c-.598.344-1.22.635-1.873.877a.075.075 0 0 0-.041.105c.36.687.772 1.341 1.225 1.962a.077.077 0 0 0 .084.028 19.963 19.963 0 0 0 6.002-2.981.076.076 0 0 0 .032-.054c.5-5.094-.838-9.52-3.549-13.442a.06.06 0 0 0-.031-.028z" />
        </svg>
      </div>
      <p class="status-text">Not in a voice channel</p>
      <p class="hint-text">Open Discord &amp; join a VC</p>
    </div>

    <!-- Connected state -->
    <div id="connected" class="screen hidden">
      <div class="header">
        <span id="server-name" class="server-name"></span>
        <span id="channel-name" class="channel-name"></span>
      </div>

      <div id="members-list" class="members-list"></div>

      <button id="mute-btn" class="mute-btn" type="button" aria-label="Toggle mute">
        <!-- Unmuted icon -->
        <svg id="icon-mic" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3zm-1 14.93V19H9v2h6v-2h-2v-2.07A7.001 7.001 0 0 0 19 11h-2a5 5 0 0 1-10 0H5a7.001 7.001 0 0 0 6 6.93z" />
        </svg>
        <!-- Muted icon -->
        <svg id="icon-mic-off" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" class="hidden">
          <path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z" />
        </svg>
        <span id="mute-label">Mute</span>
      </button>
    </div>

    <!-- Error / companion offline state -->
    <div id="error" class="screen hidden">
      <p class="status-text">Companion offline</p>
      <p class="hint-text">Start the companion server</p>
    </div>

    <script src="scripts/widget.js"></script>
  </body>
</html>
