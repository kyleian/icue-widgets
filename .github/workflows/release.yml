name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────
  # Run CI checks before releasing
  # ────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run lint:html
      - run: npm run format:check

  validate:
    name: Validate Widgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate widgets/discord

  companion-test:
    name: Companion Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:coverage

  # ────────────────────────────────────────────────────
  # Package widgets and publish a GitHub Release
  # ────────────────────────────────────────────────────
  release:
    name: Package & Release
    needs: [lint, validate, companion-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install iCUE Widget CLI
        run: npm install -g @elgato/icuewidget-cli || echo "CLI not yet published — using zip fallback"

      - name: Package widgets
        id: package
        run: |
          mkdir -p dist
          for widget_dir in widgets/*/; do
            widget_name=$(basename "$widget_dir")
            echo "Packaging $widget_name…"
            if command -v icuewidget &>/dev/null; then
              icuewidget package "$widget_dir" --output dist/
            else
              echo "icuewidget CLI not found — zipping as fallback"
              (cd "$widget_dir" && zip -r "../../dist/${widget_name}.icuewidget" .)
            fi
          done
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            ## iCUE Widgets — ${{ github.ref_name }}

            ### Installation
            1. Download the `.icuewidget` file(s) below
            2. Open **iCUE → Widgets** and click the **+** button
            3. Select the downloaded file

            ### Included Widgets
            - **Discord Voice** — Shows your active voice channel, members, and mute toggle
          files: dist/*.icuewidget
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
